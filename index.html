<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAP Academy Registration Form</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBNsolLV1wFWwf3Edw_2CdIdwgxMx0Kqb382LEsoAFaw&s=10">
</head>

<body>

    <h1 align="center">TAP Academy Registration Form</h1>

    <form>

        <!-- PERSONAL DETAILS -->
        <fieldset>
            <legend><b>Personal Details</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><label for="first_name">First Name:</label></td>
                    <td>
                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            placeholder="Enter your first name"
                            required>
                    </td>
                </tr>

                <tr>
                    <td><label for="surname">Surname:</label></td>
                    <td>
                        <input
                            type="text"
                            id="surname"
                            name="surname"
                            placeholder="Enter your surname">
                    </td>
                </tr>

                <tr>
                    <td><label for="mobile">Mobile Number:</label></td>
                    <td>
                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="Enter your mobile number"
                            required>
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email:</label></td>
                    <td>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </td>
                </tr>

                <tr>
                    <td><label for="password">Password:</label></td>
                    <td>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter 8 characters"
                            minlength="8"
                            required>
                    </td>
                </tr>

                <tr>
                    <td><label for="confirm_password">Confirm Password:</label></td>
                    <td>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Re-enter your password"
                            minlength="8"
                            required>
                    </td>
                </tr>

                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td>
                        <input
                            type="date"
                            id="dob"
                            name="dob"
                            required>
                    </td>
                </tr>

                <tr>
                    <td><label for="age">Age:</label></td>
                    <td>
                        <input
                            type="number"
                            id="age"
                            name="age"
                            min="18"
                            max="100"
                            placeholder="Enter your age"
                            required>
                    </td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <input
                            type="radio"
                            id="male"
                            name="gender"
                            value="Male">
                        <label for="male">Male</label>

                        <input
                            type="radio"
                            id="female"
                            name="gender"
                            value="Female">
                        <label for="female">Female</label>

                        <input
                            type="radio"
                            id="others"
                            name="gender"
                            value="Others">
                        <label for="others">Others</label>
                    </td>
                </tr>

                <tr>
                    <td><label for="country">Country:</label></td>
                    <td>
                        <select id="country" name="country">
                            <option value="">-- Select your country --</option>
                            <option value="India">INDIA</option>
                            <option value="USA">USA</option>
                            <option value="China">CHINA</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="picture">Upload Picture:</label></td>
                    <td>
                        <input
                            type="file"
                            id="picture"
                            name="picture">
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </fieldset>


        <br>


        <!-- COURSE DETAILS -->
        <fieldset>
            <legend><b>Course Details</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><label for="course">Select Course:</label></td>
                    <td>
                        <select
                            id="course"
                            name="course"
                            required>

                            <option value="">-- Select your course --</option>
                            <option value="Java Full Stack">
                                Java Full Stack
                            </option>
                            <option value="DSA">
                                DSA
                            </option>
                            <option value="AI">
                                AI
                            </option>
                            <option value="Data Science">
                                Data Science
                            </option>

                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Delivery Mode:</td>
                    <td>

                        <input
                            type="radio"
                            id="online"
                            name="delivery_mode"
                            value="Online">

                        <label for="online">Online</label>

                        <input
                            type="radio"
                            id="offline"
                            name="delivery_mode"
                            value="Offline">

                        <label for="offline">Offline</label>

                    </td>
                </tr>

                <tr>
                    <td><label for="institute">Institute Name:</label></td>
                    <td>
                        <input
                            type="text"
                            id="institute"
                            name="institute"
                            value="TAP ACADEMY"
                            readonly>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="coding_level">
                            Coding Knowledge Level:
                        </label>
                    </td>

                    <td>
                        <input
                            type="range"
                            id="coding_level"
                            name="coding_level"
                            min="1"
                            max="10"
                            value="5">

                        <br>

                        <small>
                            1 = Beginner &nbsp;&nbsp;
                            10 = Expert
                        </small>
                    </td>
                </tr>

            </table>

        </fieldset>


        <br>


        <!-- BUTTONS -->
        <table cellpadding="8">
            <tr>
                <td>
                    <input type="submit" value="Submit">
                </td>

                <td>
                    <input type="reset" value="Clear Form">
                </td>
            </tr>
        </table>

    </form>

</body>

</html>
